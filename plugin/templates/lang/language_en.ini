# English texts of the web interface (also the fallback for missing entries in other languages).
# %s / %d are replaced by the page.

[UI]
TITLE=Mammotion Lawn Mower
NAV_SETTINGS=Settings
NAV_LOG=Log
DATE_FORMAT=Y-m-d H:i:s

STATUS=Status
BRIDGE_SERVICE=Bridge service
RUNNING=running
STOPPED=stopped
CLOUD=Mammotion cloud
CONNECTED=connected
NOT_CONNECTED=not connected
LAST_UPDATE=Last update
BTN_RESTART=Restart
BTN_STOP=Stop

WAITING=Waiting for the first status report from the mower
WAITING_SINCE=(for %s)
WAITING_OLD_VALUES=Showing the last known values.
WAITING_NO_VALUES=Values will appear automatically as soon as the mower reports.

COL_VALUE=Value
COL_CONTENT=Content
COL_MEANING=Meaning
COL_TOPIC=MQTT topic
ALL_VALUES=all possible values
UNKNOWN_MODE=unknown state

HINT_SUMMARY=Summary for all devices: %s (0/1) and %s.
HINT_RESET=Acknowledge errors: MQTT publish to %s (all) or %s.
DEVICE_PLACEHOLDER=<device>

SETTINGS=Settings
ENABLED=Bridge enabled
ACCOUNT=Mammotion account
ACCOUNT_EMAIL=E-mail / account of the Mammotion app
PASSWORD=Password
PASSWORD_SAVED=(saved – leave empty to keep it)
ACCOUNT_TIP=Tip: Create a second account in the Mammotion app and share the mower with it. That way the bridge does not log out your main login in the app.

PROBLEMS=Problem detection
PROBLEM_MODES=Report these device states (value "mode") as a problem:
PROBLEM_MODES_HINT=The device state is sent as a number in the value "mode" and as text in "mode_text". If the mower is in one of the checked states, "problem" is set to 1.
ERROR_HOLD=Keep a reported error as a problem for (minutes, 0 = until acknowledged)
OFFLINE_LIMIT=Offline longer than … minutes = problem (0 = off)
REFRESH=Request the status at least every … seconds (0 = automatic only)
LANGUAGE=Language of the MQTT texts (state, problems, errors)
LANGUAGE_HINT=Error texts exist in all languages; state and problem texts in German or English.

MQTT=MQTT
BASE_TOPIC=Base topic
REPUBLISH=Resend all values every … seconds
USE_LOXBERRY=Use the LoxBerry broker credentials (recommended)
BROKER_HOST=Broker host
BROKER_PORT=Port
BROKER_USER=User
BROKER_PASSWORD=Password
BROKER_PASSWORD_SAVED=(saved)

LOGGING=Logging
SAVE=Save and restart bridge

[MSG]
SAVED=Settings saved.
SAVE_FAILED=Error: The settings could not be saved!
STARTED=The bridge was started.
RESTARTED=The bridge was restarted.
STOPPED=The bridge was stopped.
STOP_FAILED=The bridge could not be stopped.
NOT_RUNNING=The bridge is not running:
REASON_DISABLED=The bridge is disabled in the settings.
REASON_NO_ACCOUNT=No Mammotion credentials (e-mail and password) have been entered yet.
REASON_UNKNOWN=Start failed – see the log for details.

[VALUES]
ONLINE_1=connected to the cloud
ONLINE_0=offline
CHARGING_1=at the charging station (charging or holding the charge)
CHARGING_0=not at the charging station
PROBLEM_1=problem – see problem_text
PROBLEM_0=everything OK
BATTERY=Battery level in percent (0–100)
MODE=Device state as a number
MODE_TEXT=Device state as text (see "mode")
PROGRESS=Progress of the current mowing task in percent
PROBLEM_TEXT=Description of the problem, otherwise "OK"
ERROR_CODE=0 = no error, otherwise the most recently reported new Mammotion error code
ERROR_TEXT=Description of the error code (empty if no error)
ERROR_SOLUTION=Suggested solution from Mammotion (often empty)
ERROR_TIME=Time of the error as Unix time, 0 = no error
LAST_REPORT=Time of the last status report as Unix time

