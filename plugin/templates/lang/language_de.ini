# Deutsche Texte der Weboberfläche. Fehlt ein Eintrag, nimmt LoxBerry den englischen.
# %s / %d werden von der Seite ersetzt.

[UI]
TITLE=Mammotion Mähroboter
NAV_SETTINGS=Einstellungen
NAV_LOG=Log
DATE_FORMAT=d.m.Y H:i:s

STATUS=Status
BRIDGE_SERVICE=Bridge-Dienst
RUNNING=läuft
STOPPED=gestoppt
CLOUD=Mammotion-Cloud
CONNECTED=verbunden
NOT_CONNECTED=nicht verbunden
LAST_UPDATE=Letzte Aktualisierung
BTN_RESTART=Neu starten
BTN_STOP=Stoppen

WAITING=Warte auf die erste Statusmeldung des Mähers
WAITING_SINCE=(seit %s)
WAITING_OLD_VALUES=Angezeigt werden die zuletzt bekannten Werte.
WAITING_NO_VALUES=Die Werte erscheinen, sobald sich der Mäher meldet – Seite dann neu laden.

COL_VALUE=Wert
COL_CONTENT=Inhalt
COL_MEANING=Bedeutung
COL_TOPIC=MQTT-Topic
ALL_VALUES=alle möglichen Werte
UNKNOWN_MODE=unbekannter Status

HINT_SUMMARY=Sammelmeldung für alle Geräte: %s (0/1) und %s.
HINT_RESET=Fehler quittieren: MQTT-Publish auf %s (alle) bzw. %s.
DEVICE_PLACEHOLDER=<gerät>

SETTINGS=Einstellungen
ENABLED=Bridge aktiviert
ACCOUNT=Mammotion-Konto
ACCOUNT_EMAIL=E-Mail / Konto der Mammotion-App
PASSWORD=Passwort
PASSWORD_SAVED=(gespeichert – leer lassen, um es beizubehalten)
ACCOUNT_TIP=Tipp: Lege in der Mammotion-App ein zweites Konto an und teile den Mäher damit. So wird dein Haupt-Login in der App nicht durch die Bridge abgemeldet.

PROBLEMS=Problemerkennung
PROBLEM_MODES=Diese Gerätestatus (Wert „mode“) als Problem melden:
PROBLEM_MODES_HINT=Der Gerätestatus wird als Zahl im Wert „mode“ und als Text in „mode_text“ gesendet. Ist der Mäher in einem der angehakten Status, wird „problem“ auf 1 gesetzt.
ERROR_HOLD=Gemeldeten Fehler so lange als Problem halten (Minuten, 0 = bis Quittierung)
OFFLINE_LIMIT=Offline länger als … Minuten = Problem (0 = aus)
REFRESH=Status spätestens alle … Sekunden anfordern (0 = nur automatisch)
LANGUAGE=Sprache der MQTT-Texte (Status, Probleme, Fehler)
LANGUAGE_HINT=Fehlertexte gibt es in allen Sprachen; Status- und Problemtexte auf Deutsch oder Englisch.

MQTT=MQTT
BASE_TOPIC=Basis-Topic
REPUBLISH=Alle Werte erneut senden alle … Sekunden
USE_LOXBERRY=Broker-Zugangsdaten des LoxBerry verwenden (empfohlen)
BROKER_HOST=Broker-Host
BROKER_PORT=Port
BROKER_USER=Benutzer
BROKER_PASSWORD=Passwort
BROKER_PASSWORD_SAVED=(gespeichert)

LOGGING=Protokoll
SAVE=Speichern und Bridge neu starten

[MSG]
SAVED=Einstellungen gespeichert.
SAVE_FAILED=Fehler: Die Einstellungen konnten nicht gespeichert werden!
STARTED=Die Bridge wurde gestartet.
RESTARTED=Die Bridge wurde neu gestartet.
STOPPED=Die Bridge wurde gestoppt.
STOP_FAILED=Die Bridge konnte nicht gestoppt werden.
NOT_RUNNING=Die Bridge läuft nicht:
REASON_DISABLED=Die Bridge ist in den Einstellungen deaktiviert.
REASON_NO_ACCOUNT=Es sind noch keine Mammotion-Zugangsdaten (E-Mail und Passwort) eingetragen.
REASON_UNKNOWN=Start fehlgeschlagen – Details im Log.

[VALUES]
ONLINE_1=mit der Cloud verbunden
ONLINE_0=offline
CHARGING_1=an der Ladestation (lädt bzw. hält die Ladung)
CHARGING_0=nicht an der Ladestation
PROBLEM_1=Problem – siehe problem_text
PROBLEM_0=alles in Ordnung
BATTERY=Akkustand in Prozent (0–100)
MODE=Gerätestatus als Zahl
MODE_TEXT=Gerätestatus als Text (siehe „mode“)
PROGRESS=Fortschritt der aktuellen Mäh-Aufgabe in Prozent
PROBLEM_TEXT=Beschreibung des Problems, sonst „OK“
ERROR_CODE=0 = kein Fehler, sonst der zuletzt gemeldete neue Mammotion-Fehlercode
ERROR_TEXT=Beschreibung zum Fehlercode (leer, wenn kein Fehler)
ERROR_SOLUTION=Lösungsvorschlag von Mammotion (oft leer)
ERROR_TIME=Zeitpunkt des Fehlers als Unix-Zeit, 0 = kein Fehler
LAST_REPORT=Zeitpunkt der letzten Statusmeldung als Unix-Zeit

[MODES]
M0=Inaktiv
M1=Online
M2=Offline
M3=Ausgeschaltet
M8=Deaktiviert
M10=Initialisierung
M11=Bereit
M12=Nicht verbunden
M13=Mäht
M14=Fährt zur Station
M15=Lädt
M16=Update läuft
M17=Gesperrt
M18=Systemfehler
M19=Pausiert
M20=Manuelles Mähen
M22=Update erfolgreich
M23=Update fehlgeschlagen
M31=Karte zeichnen
M32=Hindernis zeichnen
M34=Kanal zeichnen
M36=Grenze bearbeiten
M37=Positionsfehler
M38=Grenzüberschreitung
M39=Ladepause
M45=Automatische Kartierung
M46=Kartierung pausiert
M47=Kartierung: Rückkehr
M48=Schlafmodus
M50=Rückkehr zum Laden
M51=Setzt zurück
M52=Wiederherstellung
